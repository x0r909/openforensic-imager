[workspace]
resolver = "3"
members = [
    "crates/forensic-core",
    "crates/hashing",
    "crates/image-reader",
    "crates/evidence-manager",
    "crates/audit-log",
    "crates/native-bindings",
    "crates/libewf-bindings",
    "crates/acquisition",
    "crates/reporting",
    "crates/tsk-bindings",
    "crates/partition-analyzer",
    "crates/filesystem",
    "crates/viewer",
    "crates/extraction",
    "crates/job-manager",
    "tests/fixtures",
    "tests/integration",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-Undecided"
rust-version = "1.93"

[workspace.dependencies]
digest = "0.11"
libc = "0.2"
md-5 = "0.11"
proptest = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
